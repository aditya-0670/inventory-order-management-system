services:
  - type: web
    name: inventory-order-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-order-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOW_STOCK_THRESHOLD
        value: "5"

databases:
  - name: inventory-order-db
    databaseName: inventory_db
    user: inventory_user
    plan: free
